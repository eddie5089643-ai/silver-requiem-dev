<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<style>
html,body{margin:0;height:100%;background:#050507;overflow:hidden}
canvas{display:block;margin:0 auto;cursor:none}
#mob{display:none;position:fixed;inset:0;pointer-events:none;font-family:system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#mob.on{display:block}
#mob .pad{position:absolute;width:196px;height:120px;pointer-events:none}
#mob .joy{position:absolute;left:0;top:0;width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:radial-gradient(circle,rgba(40,36,64,.35),rgba(20,18,32,.55));pointer-events:auto;touch-action:none}
#mob .knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(207,224,255,.4);border:1px solid rgba(255,255,255,.7);pointer-events:none}

#mob .side{position:absolute;pointer-events:auto;background:rgba(10,10,16,.92);border-left:1px solid #2a2840;color:#ddd;overflow:auto;box-sizing:border-box;padding:8px;touch-action:pan-y}
#mob .side h3{margin:2px 0 6px;font-size:13px;color:#b8a0ff;font-weight:600;letter-spacing:1px}

#mob .cmd{display:block;flex:1;min-width:0;margin:0;padding:6px 6px;border:1px solid #3a3658;background:#16142a;color:#fff;border-radius:6px;text-align:left;font-size:12px;line-height:1.25}
#mob .cmd b{color:#ffe9a8;font-weight:600;font-family:ui-monospace,monospace}

<canvas id="c"></canvas>
<div id="mob">
  <div class="pad" id="mobPad">

  </div>

  <div class="inbar" id="mobBar"><input id="mobIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入 / 開頭的指令或聊天"><button id="mobGo">送出</button></div>

<script>
'use strict';
try{document.fonts&&document.fonts.load('40px "UnifrakturMaguntia"');}catch(e){}
// =====================================================================
//  銀刃安魂曲 Silver Requiem — v2
//  大地圖 Boss 戰 · 像素骨架角色 · 振刀架勢 · 程序生成交響合唱
// =====================================================================
const W=800,H=450,WW=3600,WH=1200,GROUND=1100,TOX=(W-640)/2,TOY=(H-360)/2;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const buf=mk(W,H),g=buf.getContext('2d');
const glw=mk(W,H),gg=glw.getContext('2d');
const bl1=mk(Math.round(W/4),Math.round(H/4)),b1=bl1.getContext('2d');
const bl2=mk(Math.round(W/8),Math.round(H/8)),b2=bl2.getContext('2d');
let S=2;
let MOB=matchMedia('(pointer:coarse)').matches||/mobile/i.test(location.search+location.hash);
const MOB_PW=170,MOB_PH=250;let mobPanelOn=true;
function resize(){let aw=innerWidth,ah=innerHeight;const land=aw>=ah;if(MOB&&mobPanelOn){if(land)aw-=MOB_PW;else ah-=MOB_PH;}
  const s=Math.min(aw/W,ah/H);S=s;
  cv.width=Math.round(W*S);cv.height=Math.round(H*S);
  if(MOB){cv.style.position='absolute';cv.style.margin='0';cv.style.left=Math.round((aw-cv.width)/2)+'px';cv.style.top=Math.round(land?(ah-cv.height)/2:0)+'px';}
  else{cv.style.position='';cv.style.left=cv.style.top='';cv.style.margin='0 auto';cv.style.marginTop=Math.max(0,(innerHeight-cv.height)/2)+'px';}
  if(window.mobLayout)mobLayout();}
addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const dist=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const easeOut=k=>1-Math.pow(1-k,3);
function ptSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-dx*t,py-ay-dy*t);}
function segDist(a,b,c,d){
  const cr=(o,p,q)=>(p[0]-o[0])*(q[1]-o[1])-(p[1]-o[1])*(q[0]-o[0]);
  const d1=cr(c,d,a),d2=cr(c,d,b),d3=cr(a,b,c),d4=cr(a,b,d);
  if(((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0)))return 0;
  return Math.min(ptSeg(a[0],a[1],c[0],c[1],d[0],d[1]),ptSeg(b[0],b[1],c[0],c[1],d[0],d[1]),ptSeg(c[0],c[1],a[0],a[1],b[0],b[1]),ptSeg(d[0],d[1],a[0],a[1],b[0],b[1]));
}

// ---------------- 輸入 ----------------
const keys={},pressed={};
const chat={open:false,text:'',log:[],hist:[],hi:-1};
// 打字欄：用隱藏的 <input> 承接輸入 → 原生支援 Ctrl+C/V/A/X、左右移動、Shift 選字、中文輸入法
const chatIn=(()=>{const el=document.createElement('input');el.id='chatIn';el.type='text';el.maxLength=60;el.autocomplete='off';el.spellcheck=false;
  el.style.cssText='position:fixed;left:-9999px;top:0;width:300px;opacity:0;pointer-events:none;';(document.body||document.documentElement).appendChild(el);
  el.addEventListener('input',()=>{chat.text=el.value;});
  el.addEventListener('keydown',e=>{e.stopPropagation();
    if(e.key==='Enter'&&!e.isComposing){e.preventDefault();chatSubmit(el.value);chatClose();}
    else if(e.key==='Escape'){e.preventDefault();chatClose();}
    else if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const H_=chat.hist;if(!H_.length)return;
      if(e.key==='ArrowUp')chat.hi=chat.hi<0?H_.length-1:Math.max(0,chat.hi-1);else chat.hi=chat.hi<0?-1:chat.hi+1;
      if(chat.hi>=H_.length)chat.hi=-1;const v=chat.hi<0?'':H_[chat.hi];el.value=v;chat.text=v;el.setSelectionRange(v.length,v.length);}});
  el.addEventListener('blur',()=>{if(chat.open&&chat.el===el)setTimeout(()=>{if(chat.open&&chat.el===el)el.focus();},0);});
  return el;})();
function chatOpen(pre){pre=pre||'';chat.open=true;chat.text=pre;chat.hi=-1;chat.el=chatIn;chatIn.value=pre;for(const k in keys)keys[k]=false;mouse.l=mouse.r=false;chatIn.focus();try{chatIn.setSelectionRange(pre.length,pre.length);}catch(e){}}
function chatClose(){chat.open=false;chat.text='';chat.el=null;chatIn.value='';chatIn.blur();}
function chatSubmit(t){t=(t||'').trim();if(!t)return;if(chat.hist[chat.hist.length-1]!==t)chat.hist.push(t);if(chat.hist.length>50)chat.hist.shift();chat.hi=-1;
  if(t.startsWith('/'))runCmd(t);else if(typeof MP!=='undefined'&&MP.on)mpChat(t);else{chat.log.push({t,life:420});if(chat.log.length>6)chat.log.shift();}}let godMode=false,aimbot=false,noPotCD=false;
function chatSay(t){chat.log.push({t,life:420});if(chat.log.length>6)chat.log.shift();}
function runCmd(line){
  const [cmd,...args]=line.slice(1).trim().split(/\s+/);const c=(cmd||'').toLowerCase();
  if(MP.on&&!MP.host&&['phase','kill','rage'].includes(c)){chatSay('多人模式中只有房主能用 /phase、/kill');return;}
  if(MP.on&&c==='rage'){chatSay('多人模式沒有怒氣');return;}
  if(c==='god'){godMode=!godMode;chatSay('無敵模式：'+(godMode?'開':'關'));}
  else if(c==='aimbot'){aimbot=!aimbot;chatSay('自動瞄準：'+(aimbot?'開':'關'));}
  else if(c==='heal'){if(P){P.hp=P.mhp;chatSay('生命已補滿');}}
  else if(c==='phase'){const n=parseInt(args[0])-1;if(boss&&!boss.dead&&n>=0&&n<=3){if(boss.dormant){mirror.force=true;updMirror();}boss.hp=Math.min(boss.hp,boss.mhp*(n===0?1:boss.phaseAt[n-1]-.01));chatSay('跳到第 '+(n+1)+' 階段');}else chatSay('用法：/phase 1~4');}
  else if(c==='kill'){if(boss&&!boss.dead&&state==='fight'){if(boss.dormant){mirror.force=true;updMirror();}const b=boss;
      if(b.last){b.lt=LAST_T;chatSay('跳過最終招');}else{b.inv=0;b.trans=0;if(b.phase<3){b.phase=3;b.ai=0;b.t=0;setMusic(b.song,3+(b.off||0));}dmgBoss(Math.ceil(b.hp)+1,b.x,b.y-24,true);chatSay(b.last?'Boss 血條已清空，進入最終招':'Boss 血條已清空');}}else chatSay('目前沒有可清空的 Boss');}
  else if(c==='rage'){if(P&&state==='fight'){if(P.rageOn)P.rage=100;else rageStart();chatSay('怒氣已回滿');}else chatSay('請先進入戰鬥');}
  else if(c==='potion'){noPotCD=!noPotCD;if(noPotCD&&P)P.potCD=0;chatSay('補血藥水無冷卻：'+(noPotCD?'開':'關'));}
  else if(c==='mobile'){MOB=!MOB;resize();chatSay('手機介面：'+(MOB?'開':'關'));}
  else if(c==='unlock'){grantBoss('mirror');chatSay('（測試）已取得鏡中銀影的全部解鎖');try{tmUI();}catch(e){}}
  else if(c==='help'){chatSay('/god 無敵  /aimbot 自動瞄準  /heal 補滿');chatSay('/kill 清空Boss血條  /rage 回滿怒氣  /potion 藥水無冷卻');chatSay('/phase 1~4 跳階段  /mobile 手機介面');}
  else chatSay('未知指令：/'+(cmd||''));
}
addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='mobIn')return;
  if(chat.open){if(chat.el&&document.activeElement!==chat.el)chat.el.focus();return;}
  if((e.key.toLowerCase()==='t'||e.key==='/')&&state==='fight'&&!paused&&!e.ctrlKey&&!e.metaKey){e.preventDefault();chatOpen(e.key==='/'?'/':'');return;}
  const k=e.key.toLowerCase();if(!keys[k])pressed[k]=true;keys[k]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright','tab'].includes(k))e.preventDefault();audioInit();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.l=mouse.r=false;});
const mouse={x:W/2,y:H/2,l:false,r:false,lp:false,rp:false};window.__m=mouse;
function mpos(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*W;mouse.y=(e.clientY-r.top)/r.height*H;}
cv.addEventListener('mousemove',mpos);
function toggleFS(){try{const d=document;if(!d.fullscreenElement&&!d.webkitFullscreenElement){const el=d.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch?.(()=>{fsFail=180;});}else{(d.exitFullscreen||d.webkitExitFullscreen).call(d);}}catch(err){fsFail=180;}}
let fsFail=0;const FSB={x:6,y:6,w:16,h:16};
cv.addEventListener('mousedown',e=>{mpos(e);audioInit();if(e.button===0&&mouse.x>FSB.x&&mouse.x<FSB.x+FSB.w&&mouse.y>FSB.y&&mouse.y<FSB.y+FSB.h){toggleFS();return;}if(e.button===0){mouse.l=true;mouse.lp=true;}if(e.button===2){mouse.r=true;mouse.rp=true;}});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=false;if(e.button===2)mouse.r=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());

// =====================================================================
//  音訊：程序生成管弦樂 + 阿卡貝拉合唱
// =====================================================================
let AC=null,master,comp,rev,musicBus,sfxBus,noiseBuf,customGain;
function impulse(sec,decay,pre){
  const len=AC.sampleRate*sec,p=Math.floor(AC.sampleRate*(pre||0)),b=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=p;i<len;i++){const k=(i-p)/(len-p);d[i]=(Math.random()*2-1)*Math.pow(1-k,decay)*(1-Math.exp(-(i-p)/600));}}
  return b;
}
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=.01;comp.release.value=.3;comp.connect(master);
  rev=AC.createConvolver();rev.buffer=impulse(4.2,2.6,.03);
  const rg=AC.createGain();rg.gain.value=.42;rev.connect(rg);rg.connect(comp);
  musicBus=AC.createGain();musicBus.gain.value=music.on?.6*musicVol:0;
  const mDry=AC.createGain();mDry.gain.value=.75;musicBus.connect(mDry);mDry.connect(comp);musicBus.connect(rev);
  sfxBus=AC.createGain();sfxBus.gain.value=.6*sfxVol;sfxBus.connect(comp);
  const sr=AC.createGain();sr.gain.value=.18;sfxBus.connect(sr);sr.connect(rev);
  customGain=AC.createGain();customGain.gain.value=music.on?.8*musicVol:0;customGain.connect(comp);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  music.nextT=AC.currentTime+.1;if(!music.want)music.want={song:music.song,sec:music.sec};music.bus=null;
  smpLoad();
}
// ---- 真實採樣配樂：music/t0~t5.mp3，切換時淡入淡出交疊 ----
const SMP={buf:[],cur:null,want:-1,mute:false,FADE:1.6,FILES:['music/t0.mp3','music/t1.mp3','music/t2.mp3','music/t3.mp3','music/t4.mp3','music/t5.mp3','music/town.mp3','music/l1.mp3']};
function smpLoad(){if(SMP.loading)return;SMP.loading=true;
  SMP.FILES.forEach((f,i)=>{fetch(f).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(ab=>AC.decodeAudioData(ab)).then(b=>{SMP.buf[i]=b;}).catch(()=>{});});}
function smpTrack(){if(state==='town'||state==='world')return 6;if((state==='fight'||state==='dead')&&boss&&boss.track!==undefined)return boss.track;if(SMP.prev!==undefined&&state==='title')return SMP.prev;if(music.song==='title')return 0;const m=/^mirror_(\d)$/.exec(music.song);if(!m)return -1;const k=+m[1]+1;if(boss&&boss.dead&&SMP.cur)return SMP.cur.id;return (k===4&&boss&&boss.last)?5:k;}
function smpFadeOut(c,T){if(!c)return;const g=c.g.gain;g.cancelScheduledValues(AC.currentTime);g.setValueAtTime(g.value,AC.currentTime);g.linearRampToValueAtTime(0,AC.currentTime+T);try{c.src.stop(AC.currentTime+T+.05);}catch(e){}}
// 音樂欣賞：從指定時間點播放
function smpPlayAt(id,off){const b=SMP.buf[id];if(!b)return false;const now=AC.currentTime;off=Math.max(0,Math.min(off||0,b.duration-.05));
  const sw=SMP.cur&&SMP.cur.id!==id;if(SMP.cur)smpFadeOut(SMP.cur,sw?1.2:.25);if(SMP.bg){smpFadeOut(SMP.bg,1.2);SMP.bg=null;}const fi=sw?1.2:.35;const src=AC.createBufferSource();src.buffer=b;src.loop=true;const g=AC.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.75,now+fi);
  src.connect(g);g.connect(customGain);src.start(now,off);SMP.cur={id,src,g,t0:now-off};SMP.prev=id;SMP.pPause=null;return true;}
// 欣賞暫停／停止 2 秒後，選單音樂淡入（獨立聲道 SMP.bg）
function smpBgStep(){if(!SMP.pPause||SMP.bg||!SMP.buf[0])return;if(AC.currentTime-(SMP.pPause.at||0)<2)return;const now=AC.currentTime;
  const src=AC.createBufferSource();src.buffer=SMP.buf[0];src.loop=true;const g=AC.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.75,now+SMP.FADE);src.connect(g);g.connect(customGain);src.start(now,0);SMP.bg={id:0,src,g,t0:now};}
function smpPos(){const c=SMP.cur;if(SMP.pPause)return SMP.pPause.off;if(!c||!SMP.buf[c.id])return 0;return (AC.currentTime-c.t0)%SMP.buf[c.id].duration;}
function smpUpdate(){ // 回傳 true 表示由採樣配樂負責播放
  const id=smpTrack();if(SMP.pPause&&state==='title')return true;if(id<0||!SMP.buf[id])return SMP.cur&&SMP.cur.id===id;
  if(SMP.cur&&SMP.cur.id===id)return true;
  const now=AC.currentTime,b=SMP.buf[id];let off=0;
  // 第四階段→最後謝幕：依目前播放時間對齊切換
  if(SMP.cur&&SMP.cur.id===4&&id===5){const d4=SMP.buf[4].duration,p4=(now-SMP.cur.t0)%d4;off=(p4>=60?89:p4)%b.duration;}
  smpFadeOut(SMP.cur,SMP.FADE);
  const src=AC.createBufferSource();src.buffer=b;src.loop=true;const g=AC.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(SMP.mute?0:.75,now+SMP.FADE);
  src.connect(g);g.connect(customGain);src.start(now,off);SMP.cur={id,src,g,t0:now-off};SMP.mute=false;
  if(music.bus){const ob=music.bus;ob.gain.cancelScheduledValues(now);ob.gain.setValueAtTime(ob.gain.value,now);ob.gain.linearRampToValueAtTime(.0001,now+SMP.FADE);}

      capO.push([c.sx+Math.cos(ah)*(cxr+Math.cos(th)*rr)+tx*Math.sin(th)*rr,c.sy+Math.sin(ah)*(cxr+Math.cos(th)*rr)+ty*Math.sin(th)*rr]);
      const r2=Wm*.45/2,cx2=c.R-Wm*.45/2;capI.push([c.sx+Math.cos(ah)*(cx2+Math.cos(th)*r2)+tx*Math.sin(th)*r2,c.sy+Math.sin(ah)*(cx2+Math.cos(th)*r2)+ty*Math.sin(th)*r2]);}
    const poly=(ctx,A,cap,B,col,al)=>{ctx.globalAlpha=al;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(A[0][0],A[0][1]);for(const q of A)ctx.lineTo(q[0],q[1]);for(const q of cap)ctx.lineTo(q[0],q[1]);for(let i=B.length-1;i>=0;i--)ctx.lineTo(B[i][0],B[i][1]);ctx.closePath();ctx.fill();};
    if(c.void){ // 黑色虛空月牙：黑色裂口＋貼齊邊緣向外擴散的白光
      const k2=c.live?0:1-f,spr=4+k2*30,outerS=[],NN2=outer.length;
      for(let L2=0;L2<5;L2++){const r1=c.R+spr*L2/5,r2=c.R+spr*(L2+1)/5;gg.globalAlpha=(1-L2/5)*.7*Math.max(f,.2);gg.fillStyle='#ffffff';gg.beginPath();
        for(let i=0;i<NN2;i++){const a=a0+dir*vis*i/(NN2-1);gg.lineTo(c.sx+Math.cos(a)*r2,c.sy+Math.sin(a)*r2);}for(let i=NN2-1;i>=0;i--){const a=a0+dir*vis*i/(NN2-1);gg.lineTo(c.sx+Math.cos(a)*r1,c.sy+Math.sin(a)*r1);}gg.closePath();gg.fill();}
      const fillP=(ctx,A,B,col,al)=>{ctx.globalAlpha=al;ctx.fillStyle=col;ctx.beginPath();A.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));for(let i=B.length-1;i>=0;i--)ctx.lineTo(B[i][0],B[i][1]);ctx.closePath();ctx.fill();};
      fillP(g,outer,inner,'#000000',Math.min(1,f*1.3));fillP(g,outer,inner2,'rgba(90,40,140,.35)',f);
      g.globalAlpha=Math.min(1,f*1.4);g.strokeStyle='#ffffff';g.lineWidth=1.3;g.beginPath();outer.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();
      g.beginPath();inner.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();
      if(Math.random()<.8){const q=outer[(Math.random()*NN2)|0];parts.push({x:q[0],y:q[1],vx:rnd(-1.5,1.5),vy:rnd(-1.5,1.5),life:18,max:18,col:'#ffffff',size:1});}

    const tint=c.col||(c.heavy?'#bfe0ff':'#9fb8ff'),core=c.core||'#ffffff';

    gg.globalAlpha=.5*f;gg.strokeStyle=tint;gg.lineWidth=1;gg.beginPath();inner.forEach((q,i)=>i?gg.lineTo(q[0],q[1]):gg.moveTo(q[0],q[1]));gg.stroke();

  for(const q of []){const fa=0;gg.save();
    for(const [w,col,al,rr] of [[8,'#9fb8ff',.35,1],[4,'#dfe8ff',.7,1],[2,'#ffffff',1,1]]){gg.globalAlpha=al*fa;gg.strokeStyle=col;gg.lineWidth=w;gg.beginPath();gg.arc(-q.r*.7,0,q.r*rr,-1.15,1.15);gg.stroke();}

  g.globalAlpha=1;gg.globalAlpha=1;
}

function R(x,y,w,h,col){cx.fillStyle=col;cx.fillRect(Math.round(x*S),Math.round(y*S),Math.ceil(w*S),Math.ceil(h*S));}
function spr2(img,x,y,sc=1){cx.imageSmoothingEnabled=false;cx.drawImage(img,Math.round(x*S),Math.round(y*S),img.width*S*sc,img.height*S*sc);}
function T(s,x,y,size,col,align='center',glow=0,fam){cx.font=fam?`${Math.round(size*S)}px ${fam}`:`900 ${Math.round(size*S)}px "Noto Serif TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif`;cx.textAlign=align;cx.textBaseline='middle';
  if(glow){cx.shadowColor=col;cx.shadowBlur=glow*S;}cx.fillStyle=col;cx.fillText(s,x*S,y*S);cx.shadowBlur=0;}
function keycap(x,y,w,label,act){R(x,y,w,12,act?'#e8e8f0':'#1c1c24');R(x,y+11,w,2,'#08080c');R(x,y,w,1,'#6a6a7a');T(label,x+w/2,y+6.5,6.5,act?'#111':'#d8d8e0');}
function icon(name,x,y,col='#e8e8f0'){ // 小圖示（向量）
  cx.save();cx.translate(x*S,y*S);cx.scale(S,S);cx.strokeStyle=col;cx.fillStyle=col;cx.lineWidth=1.3;cx.lineCap='round';
  if(name==='sword'){cx.beginPath();cx.moveTo(-5,5);cx.lineTo(5,-5);cx.stroke();cx.beginPath();cx.moveTo(-4,1);cx.lineTo(-1,4);cx.stroke();}
  if(name==='parry'){cx.beginPath();cx.moveTo(0,-6);cx.lineTo(1.5,-1.5);cx.lineTo(6,0);cx.lineTo(1.5,1.5);cx.lineTo(0,6);cx.lineTo(-1.5,1.5);cx.lineTo(-6,0);cx.lineTo(-1.5,-1.5);cx.closePath();cx.fill();}
  if(name==='wing'){for(let i=0;i<4;i++){cx.beginPath();cx.moveTo(-4,2-i);cx.lineTo(4-i*1.5,-4+i*2.2);cx.stroke();}}
  if(name==='dash'){for(let i=0;i<3;i++){cx.beginPath();cx.moveTo(-5+i*3,-3);cx.lineTo(-2+i*3,0);cx.lineTo(-5+i*3,3);cx.stroke();}}
  if(name==='rage'){cx.beginPath();cx.moveTo(0,-6);cx.quadraticCurveTo(5,-1,3,4);cx.quadraticCurveTo(0,6,-3,4);cx.quadraticCurveTo(-5,0,-1,-2);cx.quadraticCurveTo(0,-4,0,-6);cx.fill();}
  if(name==='gun'){cx.fillRect(-5,-3,10,2.6);cx.fillRect(-4.5,-1,3,5);cx.fillRect(4.5,-2.6,1.6,1.4);}
  if(name==='bow'){cx.beginPath();cx.moveTo(-1,-6);cx.quadraticCurveTo(-6,0,-1,6);cx.stroke();cx.lineWidth=.7;cx.beginPath();cx.moveTo(-1,-6);cx.lineTo(-1,6);cx.stroke();cx.lineWidth=1.1;cx.beginPath();cx.moveTo(-3,0);cx.lineTo(5.5,0);cx.stroke();cx.beginPath();cx.moveTo(5.5,0);cx.lineTo(3.5,-1.5);cx.moveTo(5.5,0);cx.lineTo(3.5,1.5);cx.stroke();}
  if(name==='potion'){cx.beginPath();cx.arc(0,2,3.5,0,TAU);cx.fill();cx.fillRect(-1.2,-5,2.4,4);}
  if(name==='note'){cx.beginPath();cx.arc(-2,3,2,0,TAU);cx.fill();cx.fillRect(-.3,-5,1.3,8);cx.fillRect(-.3,-5,4,1.3);}

function drawBossFireBar(b,x0,y0,fw){if(fw<=0)return;const ph=Math.min(3,b.phase||0),t=frameN,dim=b.inv>0?.35:1;
  const gr=cx.createLinearGradient(0,y0*S,0,(y0+7)*S);gr.addColorStop(0,'#4a4a52');gr.addColorStop(.5,'#2c2c32');gr.addColorStop(1,'#18181c');cx.fillStyle=gr;cx.fillRect(Math.round(x0*S),Math.round(y0*S),Math.ceil(fw*S),Math.ceil(7*S));
  cx.save();cx.beginPath();cx.rect(x0*S,(y0-5)*S,fw*S,12*S);cx.clip();cx.globalCompositeOperation='lighter';cx.scale(S,S);cx.fillStyle='#ffffff';
  const dens=[.45,.7,.95,1][ph],hM=[5,7.5,11,12][ph],al=[.45,.65,.88,.95][ph]*dim,stp=[9,6,4,3.5][ph];
  for(let x=x0+2;x<x0+fw;x+=stp){const id=Math.round(x),n1=Math.sin(id*1.3+t*.21),n2=Math.sin(id*.47-t*.13);if((n1*.5+.5)>dens+.15)continue;
    const fl=.5+.5*Math.sin(t*.37+id*2.1),h=hM*(.45+.55*fl)*(.7+.3*n2);flameTongue(cx,x,y0+7.5,-Math.PI/2+n2*.25,h,stp*1.5,Math.sin(t*.2+id)*1.5,al*(.6+.4*fl));}
  const ov=[0,.1,.34,.62][ph]*dim;if(ov>0){cx.globalAlpha=ov*(.85+.15*Math.sin(t/7));cx.fillRect(x0,y0,fw,7);}
  cx.globalAlpha=al*.8;for(let i=0;i<[1,2,3,5][ph];i++){const sx=x0+rnd(0,fw),sy=y0+rnd(-3,6);cx.fillRect(sx,sy,.8,.8);}
  cx.restore();cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  R(x0,y0,fw,1,'rgba(255,255,255,'+(.25+.15*ph)+')');}
function drawBossIcon(b,cxI,cyI){const ph=Math.min(3,b.phase||0),idx=ph<=1?0:ph===2?1:2,im=BICON[idx],sc=.8,w=im.width*sc,h=im.height*sc,t=frameN;
  const lv=[.7,.95,1.05,1.15][ph],rad=[18,24,29,36][ph],pul=.55+.45*Math.sin(t/38);
  cx.save();cx.globalCompositeOperation='lighter';
  const gx=cxI*S,gy=cyI*S,gr=cx.createRadialGradient(gx,gy,0,gx,gy,rad*(1+.12*pul)*S);
  const col=ph===2?'200,170,255':'235,235,255';gr.addColorStop(0,`rgba(${col},${.42*lv*(.6+.4*pul)})`);gr.addColorStop(.55,`rgba(${col},${.16*lv*(.5+.5*pul)})`);gr.addColorStop(1,`rgba(${col},0)`);
  cx.fillStyle=gr;cx.beginPath();cx.arc(gx,gy,rad*1.15*S,0,TAU);cx.fill();
  // 往外散的光點（階段越後越多、越遠）
  if(Math.random()<[.15,.35,.55,.8][ph]){const a=rnd(0,TAU);bIconFx.push({k:'d',x:cxI+Math.cos(a)*8,y:cyI+Math.sin(a)*8,vx:Math.cos(a)*rnd(.15,.35)*(1+ph*.5),vy:Math.sin(a)*rnd(.15,.35)*(1+ph*.5),life:rnd(30,55)*(1+ph*.25),max:60});}
  // 四階段：發光眼睛冒出往右的白火
  const ex=cxI-w/2+24.7*sc,ey=cyI-h/2+24.2*sc;
  if(ph===3){for(let i=0;i<2;i++)bIconFx.push({k:'f',x:ex+rnd(-1,1),y:ey+rnd(-1,1),vx:rnd(.5,1.1),vy:rnd(-.25,.05),life:rnd(18,30),max:30,s:rnd(.6,1.3)});}
  for(const q of bIconFx){q.x+=q.vx;q.y+=q.vy;if(q.k==='f'){q.vy-=.015;q.vx*=.985;}q.life--;}
  bIconFx=bIconFx.filter(q=>q.life>0);if(bIconFx.length>220)bIconFx.splice(0,bIconFx.length-220);
  for(const q of bIconFx){const k=q.life/q.max;
    if(q.k==='d'){cx.globalAlpha=k*.9*lv;cx.fillStyle='#ffffff';cx.fillRect(Math.round(q.x*S),Math.round(q.y*S),Math.ceil(S),Math.ceil(S));}}
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  cx.imageSmoothingEnabled=false;cx.drawImage(im,Math.round((cxI-w/2)*S),Math.round((cyI-h/2)*S),Math.round(w*S),Math.round(h*S));
  if(ph===3){cx.globalCompositeOperation='lighter';
    // 白火：舌狀火焰沿右方飄動＋火星
    cx.save();cx.translate(0,0);cx.scale(S,S);cx.fillStyle='#ffffff';
    for(let i=0;i<3;i++){const sw=Math.sin(t/6+i*2.1)*2.2,hh=9+5*Math.sin(t/9+i)+i*3;flameTongue(cx,ex-1,ey,-.12+Math.sin(t/11+i)*.12,hh,4.5-i,sw,.55-.12*i);}
    cx.restore();
    for(const q of bIconFx)if(q.k==='f'){const k=q.life/q.max,r=(1.6*k+.6)*q.s;cx.globalAlpha=Math.min(1,k*1.3);cx.fillStyle=k>.5?'#ffffff':'#dcd4ff';cx.beginPath();cx.arc(q.x*S,q.y*S,r*S,0,TAU);cx.fill();}
    const gl=cx.createRadialGradient(ex*S,ey*S,0,ex*S,ey*S,6*S);gl.addColorStop(0,'rgba(255,255,255,.9)');gl.addColorStop(1,'rgba(220,210,255,0)');cx.globalAlpha=.7+.3*pul;cx.fillStyle=gl;cx.beginPath();cx.arc(ex*S,ey*S,6*S,0,TAU);cx.fill();
    cx.globalAlpha=1;cx.globalCompositeOperation='source-over';}
  cx.restore();}

    const next=()=>{if(done||!MP.on)return;clearTimeout(to);if(i>=10){done=true;mpCloseAll();mpStatus('目前沒有可加入的房間，可以自己建立一個');return;}

function mpAlive(id){if(id==='h')return P&&!P.dead;const s=MP.rs[id];return !!(s&&!s.d);}

<script>
(function(){
  const CMDS=[['/god','無敵模式 開／關'],['/aimbot','自動瞄準 開／關'],['/heal','生命補滿'],['/kill','清空 Boss 血條'],['/rage','回滿怒氣'],['/potion','補血藥水無冷卻 開／關'],['/phase 1','跳到第一階段'],['/phase 2','跳到第二階段'],['/phase 3','跳到第三階段'],['/phase 4','跳到第四階段'],['/help','顯示指令說明'],['/mobile','手機介面 開／關']];
  const root=document.getElementById('mob'),pad=document.getElementById('mobPad'),side=document.getElementById('mobSide'),list=document.getElementById('mobCmds'),
    tb=document.getElementById('mobType'),bar=document.getElementById('mobBar'),inp=document.getElementById('mobIn'),go=document.getElementById('mobGo');
  const buildList=()=>{for(const [c,d] of CMDS){const row=document.createElement('div');row.className='row';
    const b=document.createElement('button');b.className='cmd';b.innerHTML='<b>'+c+'</b><span>'+d+'</span>';
    b.addEventListener('click',e=>{e.preventDefault();try{audioInit();}catch(_){}runCmd(c);if(state!=='fight'&&c.startsWith('/phase'))chatSay('請先進入戰鬥');});
    const q=document.createElement('button');q.className='q';q.textContent='✎';q.title='快速輸入到輸入框';
    q.addEventListener('click',e=>{e.preventDefault();openIn(c.startsWith('/phase')?'/phase ':c);});
    row.appendChild(b);row.appendChild(q);list.appendChild(row);}};
  const joy=document.getElementById('mobJoy'),knob=document.getElementById('mobKnob');let jid=null;
  const setDir=(k,on,tap)=>{if(on&&!keys[k]&&tap)pressed[k]=true;keys[k]=on;};
  const joyMove=e=>{const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R_=r.width/2-12;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>R_){dx*=R_/d;dy*=R_/d;}
    knob.style.transform='translate('+dx+'px,'+dy+'px)';const nx=dx/R_,ny=dy/R_;
    setDir('arrowright',nx>.35,false);setDir('arrowleft',nx<-.35,false);setDir('arrowup',ny<-.5,true);setDir('arrowdown',ny>.55,false);};
  const joyEnd=()=>{jid=null;joy.classList.remove('dn');knob.style.transform='';for(const k of ['arrowright','arrowleft','arrowup','arrowdown'])keys[k]=false;};
  joy.addEventListener('pointerdown',e=>{e.preventDefault();try{audioInit();}catch(_){}jid=e.pointerId;joy.setPointerCapture&&joy.setPointerCapture(e.pointerId);joy.classList.add('dn');joyMove(e);});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===jid){e.preventDefault();joyMove(e);}});
  joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);joy.addEventListener('lostpointercapture',joyEnd);
  for(const el of root.querySelectorAll('[data-d=dash]')){
    el.addEventListener('pointerdown',e=>{e.preventDefault();try{audioInit();}catch(_){}el.classList.add('dn');pressed['shift']=true;keys['shift']=true;});
    const up=e=>{e.preventDefault();el.classList.remove('dn');keys['shift']=false;};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);}
  // 攻擊（左鍵）／振刀（右鍵）／切換武器
  const act=document.getElementById('mobAct');let held=0;
  const aimAt=()=>{if(!P||state!=='fight')return;let x,y;if(boss&&!boss.dead&&!boss.hidden&&!boss.dormant){x=boss.x;y=boss.y-17;}else{const c=pc();x=c.x+P.face*80;y=c.y;}mouse.x=clamp((x-VX0)*VZ,0,W);mouse.y=clamp((y-VY0)*VZ,0,H);};
  const holdLoop=()=>{if(held>0){aimAt();requestAnimationFrame(holdLoop);}};
  for(const el of root.querySelectorAll('[data-a]')){const a=el.dataset.a;
    const dn=e=>{e.preventDefault();try{audioInit();}catch(_){}el.classList.add('dn');
      if(a==='atk'){held++;aimAt();mouse.l=true;mouse.lp=true;if(held===1)requestAnimationFrame(holdLoop);}
      else if(a==='parry'){held++;aimAt();mouse.r=true;mouse.rp=true;if(held===1)requestAnimationFrame(holdLoop);}
      else if(a==='ok'){pressed['enter']=true;keys['enter']=true;setTimeout(()=>{keys['enter']=false;},60);}
      else if(a==='swap'){const k=!P||P.weapon==='katana'?'2':P.weapon==='gun'?'3':'1';pressed[k]=true;keys[k]=true;setTimeout(()=>{keys[k]=false;},60);}};
    const up=e=>{e.preventDefault();if(!el.classList.contains('dn'))return;el.classList.remove('dn');
      if(a==='atk'){mouse.l=false;held=Math.max(0,held-1);}else if(a==='parry'){mouse.r=false;held=Math.max(0,held-1);}};
    el.addEventListener('pointerdown',e=>{el.setPointerCapture&&el.setPointerCapture(e.pointerId);dn(e);});
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);}
  const openIn=(pre)=>{pre=typeof pre==='string'?pre:'';bar.classList.add('on');inp.value=pre;chat.open=true;chat.text=pre;chat.el=inp;chat.hi=-1;for(const k in keys)keys[k]=false;setTimeout(()=>{inp.focus();try{inp.setSelectionRange(pre.length,pre.length);}catch(_){}},30);};
  const closeIn=()=>{bar.classList.remove('on');chat.open=false;chat.text='';chat.el=null;inp.blur();};
  const send=()=>{chatSubmit(inp.value);closeIn();};
  tb.addEventListener('click',e=>{e.preventDefault();bar.classList.contains('on')?closeIn():openIn();});
  go.addEventListener('click',e=>{e.preventDefault();send();});
  inp.addEventListener('input',()=>{chat.text=inp.value.slice(0,60);});
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send();}else if(e.key==='Escape')closeIn();else if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const H_=chat.hist;if(!H_.length)return;if(e.key==='ArrowUp')chat.hi=chat.hi<0?H_.length-1:Math.max(0,chat.hi-1);else chat.hi=chat.hi<0?-1:chat.hi+1;if(chat.hi>=H_.length)chat.hi=-1;const v=chat.hi<0?'':H_[chat.hi];inp.value=v;chat.text=v;}});
  buildList();
  const fsb=document.getElementById('mobFS'),pnb=document.getElementById('mobPanel');
  fsb.addEventListener('click',async e=>{e.preventDefault();try{audioInit();}catch(_){}const d=document;
    try{if(!d.fullscreenElement&&!d.webkitFullscreenElement){const el=d.documentElement;await (el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:'hide'});try{await screen.orientation.lock('landscape');}catch(_){}}
      else{try{screen.orientation.unlock();}catch(_){}await (d.exitFullscreen||d.webkitExitFullscreen).call(d);}}catch(_){chatSay('此瀏覽器不支援全屏：iPhone 請用「分享 → 加入主畫面」再開啟');}});
  pnb.addEventListener('click',e=>{e.preventDefault();mobPanelOn=!mobPanelOn;resize();});
  document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement&&MOB){mobPanelOn=false;}resize();});
  window.mobLayout=function(){root.classList.toggle('on',!!MOB);if(!MOB){closeIn&&bar.classList.contains('on')&&closeIn();return;}
    const land=innerWidth>=innerHeight,r=cv.getBoundingClientRect();
    side.style.display=mobPanelOn?'':'none';fsb.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'⛶ 離開':'⛶ 全屏';
    if(land){side.style.cssText='right:0;top:0;bottom:0;width:'+MOB_PW+'px;border-left:1px solid #2a2840;border-top:0;display:'+(mobPanelOn?'block':'none');}
    else{side.style.cssText='left:0;right:0;bottom:0;height:'+MOB_PH+'px;border-top:1px solid #2a2840;border-left:0;display:'+(mobPanelOn?'block':'none');}
    list.classList.toggle('grid',!land);
    if(land){pad.style.left=Math.round(r.left+10)+'px';pad.style.top=Math.round(Math.max(r.top+4,r.bottom-128))+'px';
      act.style.left=Math.round(r.right-156)+'px';act.style.top=Math.round(Math.max(r.top+12,r.bottom-112))+'px';
      tb.style.left=Math.round(r.left+8)+'px';tb.style.top=Math.round(r.top+30)+'px';fsb.style.left=Math.round(r.left+82)+'px';fsb.style.top=tb.style.top;pnb.style.left=Math.round(r.left+156)+'px';pnb.style.top=tb.style.top;}
    else{const free=innerHeight-MOB_PH-r.bottom,ok=free>150,y0=r.bottom+Math.max(14,(free-132)/2);
      pad.style.left='10px';pad.style.top=Math.round(ok?y0:Math.max(r.top+4,r.bottom-128))+'px';
      act.style.left=Math.round(innerWidth-158)+'px';act.style.top=Math.round(ok?y0+20:Math.max(r.top+12,r.bottom-112))+'px';
      tb.style.left=Math.round(innerWidth/2-108)+'px';tb.style.top=Math.round(ok?r.bottom+8:r.top+4)+'px';fsb.style.left=Math.round(innerWidth/2-34)+'px';fsb.style.top=tb.style.top;pnb.style.left=Math.round(innerWidth/2+40)+'px';pnb.style.top=tb.style.top;}};
  mobLayout();
})();

// ---- 難度：遊戲中右上角切換（戰鬥中不能切）----
(function(){
  const st=document.createElement('style');
  st.textContent='#diffTog{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:60;font:13px system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;letter-spacing:.08em;padding:6px 12px;border-radius:8px;border:1px solid rgba(184,160,255,.7);background:rgba(16,14,28,.82);color:#e8e4ff;cursor:pointer}#diffTog.hard{border-color:#ff6070;color:#ffd0d6;background:rgba(40,8,14,.85)}#diffTog:disabled{opacity:.45;cursor:default}#diffTip{position:fixed;top:calc(44px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:60;font:12px system-ui,sans-serif;color:#ffd0d6;background:rgba(0,0,0,.8);padding:4px 8px;border-radius:6px;display:none}';
  document.head.appendChild(st);
  const b=document.createElement('button');b.id='diffTog';document.body.appendChild(b);
  const tip=document.createElement('div');tip.id='diffTip';document.body.appendChild(tip);
  let tipT=0;
  function locked(){return state==='fight'?'戰鬥中不能切換難度':(MP.on&&!MP.host?'只有房主能切換難度':'');}
  function sync(){
    const inFight=state==='fight';
    b.style.display=inFight?'none':'';const low=state!=='title'&&state!=='town'&&state!=='world';if(state==='world'){const rc=cv.getBoundingClientRect();b.style.top=(rc.top+rc.height*40/H)+'px';b.style.bottom='';tip.style.top=(rc.top+rc.height*40/H+34)+'px';tip.style.bottom='';}else{b.style.top=low?'auto':'';b.style.bottom=low?'calc(8px + env(safe-area-inset-bottom))':'';tip.style.top=low?'auto':'';tip.style.bottom=low?'calc(44px + env(safe-area-inset-bottom))':'';}
    b.textContent=tr('難度：')+tr(GAMEDIFF===1?'困難':'普通');
    b.classList.toggle('hard',GAMEDIFF===1);b.disabled=!!locked();
    if(tipT&&performance.now()>tipT){tip.style.display='none';tipT=0;}
  }
  b.onclick=e=>{e.stopPropagation();const l=locked();if(l){tip.textContent=tr(l);tip.style.display='block';tipT=performance.now()+1800;return;}
    GAMEDIFF=GAMEDIFF===1?0:1;try{localStorage.setItem('sr_diff',String(GAMEDIFF));}catch(_){}try{tmUI();}catch(_){}sync();};
  try{const v=parseInt(localStorage.getItem('sr_diff'));if(v===0||v===1)GAMEDIFF=v;}catch(_){}
  setInterval(sync,200);sync();
})();

function bossPreview(n){const pnl=document.querySelector('#invRoot .panel');let d=document.getElementById('bpv');if(d)d.remove();d=document.createElement('div');d.id='bpv';
  const views=PREVIEW[n],lab={front:'正面',q3:'45 度',side:'側面',fly:'振翅飛行'},sz={};for(const v of views){const im=DK_IMG[(v==='fly'?'fly0':v)+'_img'];sz[v]=[im.width||300,im.height||220];}
  d.innerHTML='<div class="views">'+views.map(v=>'<div><canvas data-v="'+v+'" width="'+sz[v][0]+'" height="'+sz[v][1]+'"></canvas><small>'+lab[v]+'</small></div>').join('')+'</div><b>'+n+'</b><small style="color:#a8a6c0">'+(n in SUMMON?'可在列表按「召喚」挑戰':'設計中')+'</small><button>返回</button>';pnl.appendChild(d);
  let alive=true;d.querySelector('button').onclick=()=>{alive=false;d.remove();};
  (function loop(){if(!alive||!document.body.contains(d))return;const t=performance.now()/1000,pulse=.55+.45*Math.sin(t*2.4);
    for(const c of d.querySelectorAll('canvas')){let v=c.dataset.v;if(v==='fly')v='fly'+(Math.floor(t*9)%6);const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,c.width,c.height);

// =====================================================================
//  Boss：受混沌侵蝕心智的龍王（主線一最終 Boss）
//  一階（100–50%）：盤旋火球 → 三連衝撞 → 盤旋火球 → 三連衝撞（最後一次可振刀彈反）
//  二階（50% 以下，混沌完全甦醒）：盤旋更快、火球兩發一組；四連衝撞，衝撞後炸出一圈混沌火球
// =====================================================================
function makeDragonKing(){
  const b=baseBoss({kind:'dragon',name:'The Corrupted Dragon King',cn:'受混沌侵蝕心智的龍王',song:'mirror',col:'#ff7a2a',track:7,hp:7000,phaseAt:[.5],flyer:true,face:-1,gap:40});
  b.y=GROUND-240;b.fr=0;
  const C=()=>pc(),fs=()=>b.face<0?1:-1; // 圖面朝左；fs=1 時不翻轉
  const mouth=()=>({x:b.x-98*fs(),y:b.y-4});
  const flyTo=(tx,ty,k=.06,mx=7)=>{ty=Math.min(ty,GROUND-90);b.vx=lerp(b.vx,clamp((tx-b.x)*k,-mx,mx),.2);b.vy=lerp(b.vy,clamp((ty-b.y)*k,-mx,mx),.2);b.x+=b.vx;b.y+=b.vy;};
  const faceP=()=>{b.face=C().x<b.x?-1:1;};
  b.idle=b=>{const c=C(),side=b.x<c.x?-1:1;flyTo(c.x+side*280,c.y-170+Math.sin(b.anim/30)*14,.04,5);faceP();};
  // A. 盤旋火球（參考豬鯊：繞著玩家轉圈，一邊吐出會追蹤的火球）
  const circle=(b,t)=>{const c=C(),p2=b.phase>=1;
    if(t===0){b.ca=Math.atan2(b.y-c.y,b.x-c.x);b.cd=Math.random()<.5?1:-1;SFX.roar();glint(b,false);}
    const dur=p2?260:200,R=240;b.ca+=b.cd*TAU/(p2?120:150);
    const tx=c.x+Math.cos(b.ca)*R,ty=c.y-40+Math.sin(b.ca)*R*.75;b.x=lerp(b.x,tx,.16);b.y=lerp(b.y,Math.min(ty,GROUND-90),.16);faceP();
    if(t>24&&t%(p2?14:20)===0){const m=mouth(),a=Math.atan2(c.y-m.y,c.x-m.x);SFX.gun();
      shot(m.x,m.y,a,p2?4.2:3.6,{shape:'fire',r:6,col:'#ff7a2a',dmg:30,life:300,home:p2?110:90,hr:p2?.045:.035});
      if(p2)shot(m.x,m.y,a+.4*b.cd,3.4,{shape:'fire',r:5,col:'#b890ff',dmg:26,life:280,home:70,hr:.03});
      part(m.x,m.y,8,'#ffb050',2,16,1);}
    return t>=dur;};
  // B. 衝撞（連續衝刺穿過玩家；最後一次是黃光，可振刀彈反）
  const charge=(b,t)=>{const c=C(),p2=b.phase>=1,N=p2?4:3,WU=p2?34:46,DA=34,RE=16,L=WU+DA+RE,i=Math.floor(t/L),k=t%L,last=i===N-1;
    if(i>=N||b.stunT>0)return stun(b);
    if(k===0){b.side=b.x<c.x?-1:1;glint(b,last);b.dashing=false;}
    if(k<WU){flyTo(c.x+b.side*320,c.y-30,.08,9);faceP();if(k<WU-10)b.da=Math.atan2(c.y-(b.y-10),c.x-b.x);
      if(k%8===0)fx.push({type:'tline',x:b.x,y:b.y-10,x2:b.x+Math.cos(b.da)*900,y2:b.y-10+Math.sin(b.da)*900,life:9,max:9,col:last?'#ffe9a8':'#ff2e4a'});return false;}
    if(k===WU){const sp=p2?18:15;b.vx=Math.cos(b.da)*sp;b.vy=Math.sin(b.da)*sp;b.face=b.vx<0?-1:1;b.dashing=true;SFX.dash();SFX.roar();addShake(5);
      strike({kind:'cap',b,r:26,life:DA,parry:last,dmg:45,seg:()=>{const h=hurtSeg(b);return [h.a[0],h.a[1],h.b[0],h.b[1]];},onDeflect:()=>{b.vx=-b.vx*.4;b.vy=-6;b.dashing=false;b.stunT=90;b.hurtF=12;flash=.6;flashCol='255,233,168';addShake(10);SFX.clang(true);}});}
    if(k<WU+DA){b.x+=b.vx;b.y+=b.vy;if(b.y>GROUND-70){b.y=GROUND-70;b.vy=-Math.abs(b.vy)*.3;}if(b.x<80||b.x>WW-80)b.vx*=-.3;if(k%2===0)part(b.x+rnd(-30,30),b.y+rnd(-20,20),2,'#ff9a3a',1.5,18,1);return false;}
    if(k===WU+DA){b.dashing=false;if(p2){ringShot(b.x,b.y-20,10,2.6,rnd(0,TAU),{shape:'fire',r:5,col:'#b890ff',dmg:24,life:260});SFX.boom&&SFX.boom();}}
    b.vx*=.85;b.vy*=.85;b.x+=b.vx;b.y+=b.vy;return false;};
  // 被彈反後：失衡墜落一段時間（輸出機會）
  const stun=(b)=>{if(b.stunT>0){b.stunT--;b.vy=Math.min(b.vy+.35,6);b.vx*=.95;b.x+=b.vx;b.y+=b.vy;if(b.y>GROUND-70){b.y=GROUND-70;b.vy=0;}if(b.stunT%10===0)part(b.x+rnd(-30,30),b.y-40,3,'#ffe9a8',1.5,20,1);return b.stunT===0;}return true;};
  b.phases=[[circle,charge,circle,charge],[charge,circle,charge,circle]];
  return b;}
function hurtSeg(b){const f=b.face<0?1:-1;return {a:[b.x-88*f,b.y-6],b:[b.x+110*f,b.y+2],r:20};}
BOSSES.push(makeDragonKing);const DRAGON_I=BOSSES.length-1;
while(BOSS_KEY.length<BOSSES.length-1)BOSS_KEY.push('arena');BOSS_KEY.push('dragonKing');
SUMMON['受混沌侵蝕心智的龍王']=DRAGON_I;
{const _bh=bossHurt;bossHurt=function(b){if(b.kind==='dragon')return hurtSeg(b);return _bh(b);};}
{const _sf=startFight;startFight=function(i){_sf(i);if(boss&&boss.kind==='dragon'){boss.x=WW/2+240;boss.y=GROUND-260;boss.pause=150;}};}
// 身體碰撞傷害（不在衝撞時也會被撞到）
{const _rb=runBoss;runBoss=function(b){_rb(b);if(b.kind==='dragon'&&!b.dead&&!b.stunT&&state==='fight'&&P&&!P.dead&&b.trans<=0){const h=hurtSeg(b),c=pc();if(ptSeg(c.x,c.y,h.a[0],h.a[1],h.b[0],h.b[1])<h.r+4)hurt(b.dashing?45:25);}
  if(b.kind==='dragon')b.fr+=b.dashing?.12:(b.stunT>0?.05:.18);};}
{const _db=drawBoss;drawBoss=function(){const b=boss;if(b&&b.kind==='dragon'){drawDragon(b);return;}_db();};}
function drawDragon(b){if(b.dead&&b.deathT>420)return;const k=b.dashing?2:Math.floor(b.fr)%6,im=DK_IMG['fly'+k+'_img'],gl=DK_IMG['fly'+k+'_glow'];if(!im||!im.complete)return;
  const f=b.face<0?1:-1,ox=DK_ANCH['fly'+k][0],oy=DK_ANCH['fly'+k][1],x=Math.round(b.x),y=Math.round(b.y+(b.stunT>0?Math.sin(frameN/3)*2:0)),pulse=.6+.4*Math.sin(frameN/12);
  const da=b.dashing?Math.atan2(b.vy,Math.abs(b.vx))*(f>0?-1:1)*.6:0;
  for(const [ctx,img,al] of [[gg,gl,pulse*(b.phase>=1?1:.75)],[g,im,b.dead?Math.max(0,1-b.deathT/420):1]]){ctx.save();ctx.translate(x,y);ctx.rotate(da);ctx.scale(f,1);ctx.globalAlpha=al;ctx.imageSmoothingEnabled=false;ctx.drawImage(img,-ox,-oy);
    if(ctx===g&&b.hurtF>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.35;ctx.drawImage(img,-ox,-oy);}ctx.restore();}
  b.rx=x;b.ry=y;b.handL=[0,0];}
</script>
<script>
// =====================================================================
//  泰拉瑞亞式開局：角色列表 → 建立角色 → 世界列表 → 建立世界 → 進入世界
// =====================================================================
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function curChar(){return (SAVE.chars||[]).find(c=>c.id===SAVE.cur)||null;}
function curW(){return (SAVE.worlds||[]).find(w=>w.id===SAVE.curW)||null;}
function curWorldMeta(){return curW();}
function cwLink(){const c=curChar();if(c){c.unlocked=c.unlocked||{};SAVE.unlocked=c.unlocked;SAVE.outfit=c.outfit;SAVE.hair=c.hair;SAVE.cls=c.cls;PCLS=c.cls||'melee';}
  const w=curW();if(w){w.quests=w.quests||{};w.rumor=w.rumor||{};SAVE.quests=w.quests;SAVE.rumor=w.rumor;}}
function cwSync(){const c=curChar();if(c){c.unlocked=SAVE.unlocked||{};c.outfit=SAVE.outfit;c.hair=SAVE.hair;c.cls=SAVE.cls||c.cls;}
  const w=curW();if(w){w.quests=SAVE.quests||{};w.rumor=SAVE.rumor||{};if(typeof fogEncode==='function'&&WORLD&&WORLD.meta===w){const f=fogEncode();if(f)w.fog=f;}}}
{const _sg=saveGame;saveGame=function(){try{cwSync();}catch(e){}_sg();};}
// 舊存檔搬進第一個角色／世界
if(!SAVE.chars){SAVE.chars=[];SAVE.worlds=[];
  const u=SAVE.unlocked||{};if(Object.keys(u).length||SAVE.cls){const c={id:uid(),name:'旅人',cls:SAVE.cls||'melee',outfit:SAVE.outfit||'adventurer',hair:SAVE.hair||'long',unlocked:u};SAVE.chars.push(c);SAVE.cur=c.id;}
  if(SAVE.quests&&Object.keys(SAVE.quests).length){const w={id:uid(),name:'舊世界',seed:String((Math.random()*1e9)|0),w:1600,h:600,quests:SAVE.quests,rumor:SAVE.rumor||{}};SAVE.worlds.push(w);SAVE.curW=w.id;}
  try{localStorage.setItem('silverRequiem2',JSON.stringify(SAVE));}catch(e){}}
cwLink();

const CW={sel:null,wsel:null,newCls:'melee',wsize:'m',del:null};
(function(){
  const st=document.createElement('style');st.textContent=`
#tChars,#tWorlds,#tWNew{display:none;position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);width:min(560px,94vw);padding:18px 18px 16px;pointer-events:auto;color:#e8e8f2;font-family:"Noto Serif TC",serif}
#tChars h2,#tWorlds h2,#tWNew h2,#tCls h2{margin:0 0 12px;font:900 19px "Noto Serif TC",serif;letter-spacing:.3em;text-align:center;color:#fff;text-shadow:0 0 10px rgba(200,190,255,.5)}
.cwlist{display:flex;flex-direction:column;gap:6px;max-height:30vh;overflow:auto;margin-bottom:8px}
.cwrow{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid #4a4860;background:#15141f;color:#e8e8f2;border-radius:3px;cursor:pointer;text-align:left;font-family:"Noto Serif TC",serif}
.cwrow:hover{background:#22203a}.cwrow.sel{border-color:#fff;background:#2a2850;box-shadow:0 0 12px rgba(200,190,255,.35)}
.cwrow .ic{font-size:24px;width:30px;text-align:center;color:#cfcfdc}.cwrow b{font-size:15px;letter-spacing:.1em}.cwrow small{display:block;color:#a8a6c0;font-size:11.5px;margin-top:2px}
.cwempty{text-align:center;color:#8a88a0;font-size:13px;padding:16px}
.cwbtns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.cwbtns button{flex:1;min-width:90px;padding:8px;border:1px solid #e6e6ee;background:none;color:#fff;font:14px "Noto Serif TC",serif;letter-spacing:.15em;cursor:pointer;border-radius:3px}
.cwbtns button:hover{background:#2a2840}.cwbtns button:disabled{opacity:.35;cursor:not-allowed}.cwbtns button.go{background:#e8e8f2;color:#111}.cwbtns button.warn{border-color:#ff6070;color:#ffd0d6}
.cwf{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px}.cwf label{width:5em;color:#cfcfdc;letter-spacing:.1em}
.cwf input{flex:1;padding:7px 9px;border:1px solid #6a6880;background:#0e0d16;color:#fff;font:14px "Noto Serif TC",serif;border-radius:3px;outline:none}.cwf input:focus{border-color:#fff}
.cwf .opt{flex:1;padding:7px 4px;border:1px solid #6a6880;background:#15141f;color:#fff;font:13px "Noto Serif TC",serif;border-radius:3px;cursor:pointer}.cwf .opt.sel{background:#e8e8f2;color:#111;border-color:#fff}.cwf .opt:disabled{opacity:.35;cursor:not-allowed}.cwf .opt small{display:block;font-size:10.5px;opacity:.75}
#tCls .card.sel{border-color:#fff;background:#2a2850;box-shadow:0 0 18px rgba(210,200,255,.45)}
#tChars .outfit{display:flex;gap:8px;justify-content:center;align-items:center;margin:8px 0 0;font-size:13px;color:#cfcfdc;flex-wrap:wrap}#tChars .outfit button{padding:5px 10px;border:1px solid #6a6880;background:#15141f;color:#fff;border-radius:3px;cursor:pointer;font:12px "Noto Serif TC",serif}#tChars .outfit button.sel{background:#e8e8f2;color:#111}#tChars .outfit button:disabled{opacity:.4;cursor:not-allowed}
#tChars .grow{margin:8px auto 0;max-width:500px;font-size:11px;color:#a8a6c0;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;max-height:16vh;overflow:auto}#tChars .grow .ok{color:#ffe9a8}#tChars .grow b{color:#cfcfdc;font-weight:600}#tChars .grow .hd{grid-column:1/-1;color:#b8a0ff;letter-spacing:.1em}`;
  document.head.appendChild(st);
  const root=document.getElementById('tmenu'),$=id=>document.getElementById(id);
  const d=document.createElement('div');d.innerHTML=`
<div id="tChars" class="lace"><h2>選擇角色</h2><div class="cwlist" id="cwChars"></div><div id="cwLook"></div>
  <div class="cwbtns"><button class="go" id="cwPlay">遊玩</button><button id="cwNew">建立角色</button><button class="warn" id="cwDel">刪除</button><button id="cwBack">返回</button></div></div>
<div id="tWorlds" class="lace"><h2>選擇世界</h2><div class="cwlist" id="cwWorlds"></div>
  <div class="cwbtns"><button class="go" id="cwEnter">進入世界</button><button id="cwWNew">建立世界</button><button class="warn" id="cwWDel">刪除</button><button id="cwWBack">返回</button></div></div>
<div id="tWNew" class="lace"><h2>建立世界</h2>
  <div class="cwf"><label>世界名稱</label><input id="cwWName" maxlength="16" placeholder="例如：銀月之地"></div>
  <div class="cnote" style="text-align:center;font-size:12px;color:#a8a6c0;margin:6px 0 0">橫版卷軸世界：從野外營地出發，每個世界各自記錄進度</div>
  <div class="cwbtns"><button class="go" id="cwWMake">建立世界</button><button id="cwWNBack">返回</button></div></div>`;
  while(d.firstElementChild)root.appendChild(d.firstElementChild);
  // 建立角色面板：加上名稱欄、改成「選職業 → 建立」
  const tc=$('tCls');tc.querySelector('h2').insertAdjacentHTML('afterend','<div class="cwf"><label>角色名稱</label><input id="cwName" maxlength="12" placeholder="輸入名稱"></div>');
  tc.querySelector('.cnote').textContent='選擇職業（建立後不能更改）· 單人模式：白髮女角 · 外觀隨著打敗 Boss 解鎖';
  const look=$('cwLook');for(const id of ['tOutfit','tHair','tGrow'])look.appendChild($(id));
  $('tClsBack').insertAdjacentHTML('beforebegin','<div class="cwbtns"><button class="go" id="cwMake">建立角色</button></div>');
  $('tClsBack').onclick=()=>{TM.panel='chars';tmUI();};
  for(const c of tc.querySelectorAll('button.card'))c.onclick=()=>{CW.newCls=c.dataset.c;tmUI();};
  for(const el of root.querySelectorAll('#cwName,#cwWName'))el.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape')el.blur();});
    $('cwMake').onclick=()=>{const name=($('cwName').value||'').trim()||'旅人';saveGame();const c={id:uid(),name,cls:CW.newCls,outfit:'adventurer',hair:'long',unlocked:{},weapons:(typeof CLS_WEAPONS!=='undefined'&&CLS_WEAPONS[CW.newCls]||['katana']).slice()};
    SAVE.chars.push(c);SAVE.cur=c.id;CW.sel=c.id;cwLink();saveGame();$('cwName').value='';TM.panel='chars';tmUI();};
  $('cwNew').onclick=()=>{CW.newCls='melee';TM.panel='cls';tmUI();setTimeout(()=>$('cwName').focus(),0);};
  $('cwBack').onclick=()=>{TM.panel=null;tmUI();};
  $('cwPlay').onclick=()=>{if(!curChar())return;TM.panel='worlds';CW.del=null;tmUI();};
  $('cwDel').onclick=()=>{const c=curChar();if(!c)return;if(CW.del!==c.id){CW.del=c.id;tmUI();return;}
    SAVE.chars=SAVE.chars.filter(x=>x.id!==c.id);SAVE.cur=SAVE.chars[0]?SAVE.chars[0].id:null;SAVE.unlocked={};CW.del=null;cwLink();try{localStorage.setItem('silverRequiem2',JSON.stringify(SAVE));}catch(e){}tmUI();};
  $('cwWBack').onclick=()=>{TM.panel='chars';CW.del=null;tmUI();};
  $('cwWNew').onclick=()=>{TM.panel='wnew';tmUI();setTimeout(()=>$('cwWName').focus(),0);};
  $('cwWNBack').onclick=()=>{TM.panel='worlds';tmUI();};
  $('cwWMake').onclick=()=>{const name=($('cwWName').value||'').trim()||'新世界';saveGame();
    const w={id:uid(),name,w:1600,h:600,quests:{},rumor:{}};SAVE.worlds.push(w);SAVE.curW=w.id;cwLink();saveGame();$('cwWName').value='';TM.panel='worlds';tmUI();};
  $('cwWDel').onclick=()=>{const w=curW();if(!w)return;if(CW.del!==w.id){CW.del=w.id;tmUI();return;}
    SAVE.worlds=SAVE.worlds.filter(x=>x.id!==w.id);SAVE.curW=SAVE.worlds[0]?SAVE.worlds[0].id:null;SAVE.quests={};SAVE.rumor={};CW.del=null;if(WORLD&&WORLD.meta.id===w.id)WORLD=null;cwLink();try{localStorage.setItem('silverRequiem2',JSON.stringify(SAVE));}catch(e){}tmUI();};
  $('cwEnter').onclick=()=>{if(!curChar()||!curW())return;saveGame();TM.panel=null;TOWN.inFight=false;worldEnter(false);};
})();
const CLS_IC={melee:'⚔',ranged:'➶',magic:'✦',support:'✚',rogue:'✧'};
function qText(q){q=q||{};return q.m1>=3?'主線一：哥布林首領已擊敗':q.m1===2?'主線一：史萊姆首領已擊敗':q.m1===1?'主線一：進行中':'尚未開始冒險';}
function cwUI(){const $=id=>document.getElementById(id),P_=TM.panel;
  for(const [id,k] of [['tChars','chars'],['tWorlds','worlds'],['tWNew','wnew']]){const el=$(id);if(el)el.style.display=state==='title'&&P_===k?'block':'none';}
  if(state!=='title')return;
  if(P_==='chars'){const L=$('cwChars'),cs=SAVE.chars||[];
    L.innerHTML=cs.length?cs.map(c=>{const n=UNLOCKS.filter(u=>(c.unlocked||{})[u.id]).length;return '<button class="cwrow'+(c.id===SAVE.cur?' sel':'')+'" data-id="'+c.id+'"><span class="ic">'+(CLS_IC[c.cls]||'⚔')+'</span><span><b>'+esc(c.name)+'</b><small>'+tr(CLS_NAME[c.cls]||'近戰')+'　·　'+tr('成長')+' '+n+' / '+UNLOCKS.length+'　·　'+tr((OUTFITS[c.outfit]||OUTFITS.adventurer).name)+'</small></span></button>';}).join(''):'<div class="cwempty">'+tr('還沒有角色，先建立一個吧')+'</div>';
    for(const b of L.querySelectorAll('.cwrow'))b.onclick=()=>{saveGame();SAVE.cur=b.dataset.id;CW.del=null;cwLink();saveGame();tmUI();};
    $('cwLook').style.display='none';$('cwPlay').disabled=!curChar();$('cwDel').disabled=!curChar();$('cwDel').textContent=tr(CW.del&&CW.del===SAVE.cur?'確定刪除？':'刪除');}
  if(P_==='worlds'){const L=$('cwWorlds'),ws=SAVE.worlds||[];
    L.innerHTML=ws.length?ws.map(w=>'<button class="cwrow'+(w.id===SAVE.curW?' sel':'')+'" data-id="'+w.id+'"><span class="ic">🌍</span><span><b>'+esc(w.name)+'</b><small>'+tr(qText(w.quests))+'</small></span></button>').join(''):'<div class="cwempty">'+tr('還沒有世界，先建立一個吧')+'</div>';
    for(const b of L.querySelectorAll('.cwrow'))b.onclick=()=>{saveGame();SAVE.curW=b.dataset.id;CW.del=null;cwLink();saveGame();tmUI();};
    $('cwEnter').disabled=!curW();$('cwWDel').disabled=!curW();$('cwWDel').textContent=tr(CW.del&&CW.del===SAVE.curW?'確定刪除？':'刪除');}
  if(P_==='cls'){for(const c of document.querySelectorAll('#tCls button.card'))c.classList.toggle('sel',c.dataset.c===CW.newCls);}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
{const _tu=tmUI;tmUI=function(){_tu();try{cwUI();}catch(e){console.error(e);}};}
tmSingle=function(){if(MP.on||TM.panel)return;try{audioInit();}catch(e){}TM.mode='single';TM.panel='chars';CW.del=null;tmUI();};
{const _tt=toTitle;toTitle=function(){if(state==='world')saveGame();_tt();};}
</script>
